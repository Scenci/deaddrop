<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>deaddrop</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <div class="header">
        <div class="header-brand">
          <img src="/icon-32x32.svg" alt="deaddrop" class="header-logo" />
          <h1>deaddrop</h1>
        </div>
        <div class="header-right">
          <div class="connection-status" id="connection-status">
            <span class="status-dot disconnected"></span>
            <span class="status-text">Not Connected</span>
          </div>
          <button id="connect-btn" class="primary">🔗 Connect</button>
          <div class="theme-toggle">
            <button id="theme-blackout" class="theme-toggle-btn active" title="Blackout">Blackout</button>
            <button id="theme-tokyo" class="theme-toggle-btn" title="Tokyo Night">Tokyo Night</button>
          </div>
          <div class="zoom-controls">
            <button id="zoom-out"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
            <span id="zoom-level">100%</span>
            <button id="zoom-in"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
          </div>
        </div>
      </div>

     <!-- Connection Modal -->
    <div id="connection-modal" class="modal hidden">
      <div class="modal-content modal-connection">
        <div class="modal-header">
          <h2>Connect to Server</h2>
          <button class="modal-close" id="modal-close">✕</button>
        </div>
        <div class="modal-body">
          <div class="connection-form">
            <div class="form-group">
              <label for="host">Host</label>
              <input type="text" id="host" placeholder="192.168.1.10 or hostname" />
            </div>
            
            <div class="form-row">
              <div class="form-group form-group-small">
                <label for="port">Port</label>
                <input type="text" id="port" placeholder="22" value="22" />
              </div>
              <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="root" />
              </div>
            </div>
            
           <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password" />
          </div>

          <div class="form-group">
            <div class="checkbox-row">
              <input type="checkbox" id="remember-password" disabled />
              <label for="remember-password" class="disabled">Remember password (save profile first)</label>
            </div>
          </div>


            
            <div id="connect-status"></div>
          </div>
          
          <div class="profiles-section">
            <div class="profiles-header">
              <span class="profiles-label">Saved Profiles</span>
              <span class="profiles-count" id="profiles-count"></span>
            </div>
            <div class="profiles-list" id="profiles-list"></div>
            
            <div class="save-profile-row">
              <input type="text" id="profile-name" placeholder="Profile name..." />
              <button id="save-profile-btn">Save</button>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button id="modal-cancel">Cancel</button>
          <button id="modal-connect" class="primary">Connect</button>
        </div>
      </div>
    </div>

        <!-- Confirm Modal -->
    <div id="confirm-modal" class="modal hidden">
      <div class="modal-content modal-confirm">
        <div class="modal-header">
          <h2 id="confirm-title">Confirm</h2>
        </div>
        <div class="modal-body">
          <p id="confirm-message"></p>
        </div>
        <div class="modal-footer">
          <button id="confirm-cancel">Cancel</button>
          <button id="confirm-ok" class="danger">Delete</button>
        </div>
      </div>
    </div>

      <!-- Main Content -->
      <div class="main-layout">
        <!-- Left Panel: Local Files -->
        <div class="file-panel local-panel">
          <div class="panel-header">
            <h3>📂 Local Machine</h3>
          </div>
          <div class="panel-toolbar">
           
            <button id="local-back-btn">← Back</button>
            <input type="text" id="local-path" class="path-input" value="/" />
            <button id="local-go-btn">Go</button>
             <input type="text" class="search-input" id="local-search" placeholder="Filter..." />
          </div>
          <div class="panel-actions">
            <button id="local-new-folder-btn">📁 New Folder</button>
            <button id="local-refresh-btn">Refresh</button>
          </div>
          <div id="local-file-list" class="file-list"></div>
        </div>

        <!-- Center: Transfer Zone -->
        <div class="transfer-zone">
          <div class="drop-zone" id="drop-zone">
            <div class="transfer-arrow">→</div>
            <p>Drag files here to upload</p>
            <p class="drop-zone-hint">LOCAL → REMOTE</p>
          </div>
          <div class="transfer-buttons">
            <button id="upload-selected-btn" class="success" disabled>📤 Upload Selected</button>
          </div>
        </div>

        <!-- Right Panel: Remote Files -->
        <div class="file-panel remote-panel">
          <div class="panel-header">
            <h3>🌐 Remote Server</h3>
            <span id="remote-server-name" class="server-name"></span>
          </div>
          <div class="panel-toolbar">
           
            <button id="remote-back-btn">← Back</button>
            <input type="text" id="remote-path" class="path-input" value="/" />
            <button id="remote-go-btn">Go</button>
            <input type="text" class="search-input" id="remote-search" placeholder="Filter..." />
          </div>
          <div class="panel-actions">
            <button id="remote-new-folder-btn">📁 New Folder</button>
            <button id="remote-refresh-btn">Refresh</button>
          </div>
          <div id="remote-file-list" class="file-list">
            <div class="not-connected-message">
              <p>Not connected</p>
              <p class="hint">Click "Connect" to access remote files</p>
            </div>
          </div>
        </div>

        <!-- Far Right: Upload Queue -->
        <div class="queue-panel">
          <div class="queue-header">
            <h3>Upload Queue</h3>
            <div class="queue-header-actions">
              <span id="queue-status"></span>
              <button id="queue-clear-btn" class="small">Clear</button>
            </div>
          </div>
          <div id="queue-list" class="queue-list">
            <div class="queue-empty">📭 No uploads in queue</div>
          </div>
        </div>
      </div>
    </div>
    <div id="toast-container"></div>
  </body>
</html>
