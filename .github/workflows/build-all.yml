name: Build All Platforms

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload .msi installer
        uses: actions/upload-artifact@v4
        with:
          name: deaddrop-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi

      - name: Upload .exe installer
        uses: actions/upload-artifact@v4
        with:
          name: deaddrop-windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe

  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload .deb package
        uses: actions/upload-artifact@v4
        with:
          name: deaddrop-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb

      - name: Upload .AppImage
        uses: actions/upload-artifact@v4
        with:
          name: deaddrop-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload .dmg installer
        uses: actions/upload-artifact@v4
        with:
          name: deaddrop-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload .app bundle
        uses: actions/upload-artifact@v4
        with:
          name: deaddrop-macos-app
          path: src-tauri/target/release/bundle/macos/*.app
