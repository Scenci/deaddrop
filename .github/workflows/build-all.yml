name: Build All Platforms

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install npm dependencies
        run: npm install

      - name: Generate icons from SVG
        run: node scripts/generate-icons.mjs

      - name: Generate Windows ICO
        run: |
          node -e "
          import('png-to-ico').then(pngToIco => {
            const fs = require('fs');
            pngToIco.default('./src-tauri/icons/icon.png')
              .then(buf => {
                fs.writeFileSync('./src-tauri/icons/icon.ico', buf);
                console.log('Generated: icon.ico');
              })
              .catch(console.error);
          }).catch(console.error);
          "

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload .msi installer
        uses: actions/upload-artifact@v4
        with:
          name: deaddrop-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi

      - name: Upload .exe installer
        uses: actions/upload-artifact@v4
        with:
          name: deaddrop-windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe

  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install npm dependencies
        run: npm install

      - name: Generate icons from SVG
        run: node scripts/generate-icons.mjs

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload .deb package
        uses: actions/upload-artifact@v4
        with:
          name: deaddrop-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb

      - name: Upload .AppImage
        uses: actions/upload-artifact@v4
        with:
          name: deaddrop-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install npm dependencies
        run: npm install

      - name: Generate icons from SVG
        run: node scripts/generate-icons.mjs

      - name: Generate macOS ICNS
        run: |
          mkdir -p src-tauri/icons/icon.iconset
          sips -z 16 16 src-tauri/icons/icon.png --out src-tauri/icons/icon.iconset/icon_16x16.png
          sips -z 32 32 src-tauri/icons/icon.png --out src-tauri/icons/icon.iconset/icon_16x16@2x.png
          sips -z 32 32 src-tauri/icons/icon.png --out src-tauri/icons/icon.iconset/icon_32x32.png
          sips -z 64 64 src-tauri/icons/icon.png --out src-tauri/icons/icon.iconset/icon_32x32@2x.png
          sips -z 128 128 src-tauri/icons/icon.png --out src-tauri/icons/icon.iconset/icon_128x128.png
          sips -z 256 256 src-tauri/icons/icon.png --out src-tauri/icons/icon.iconset/icon_128x128@2x.png
          sips -z 256 256 src-tauri/icons/icon.png --out src-tauri/icons/icon.iconset/icon_256x256.png
          sips -z 512 512 src-tauri/icons/icon.png --out src-tauri/icons/icon.iconset/icon_256x256@2x.png
          sips -z 512 512 src-tauri/icons/icon.png --out src-tauri/icons/icon.iconset/icon_512x512.png
          cp src-tauri/icons/icon.png src-tauri/icons/icon.iconset/icon_512x512@2x.png
          iconutil -c icns src-tauri/icons/icon.iconset -o src-tauri/icons/icon.icns
          rm -rf src-tauri/icons/icon.iconset

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload .dmg installer
        uses: actions/upload-artifact@v4
        with:
          name: deaddrop-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload .app bundle
        uses: actions/upload-artifact@v4
        with:
          name: deaddrop-macos-app
          path: src-tauri/target/release/bundle/macos/*.app
