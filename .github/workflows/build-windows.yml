name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install npm dependencies
        run: npm install

      - name: Generate icons from SVG
        run: node scripts/generate-icons.mjs

      - name: Generate Windows ICO
        run: |
          node -e "
          import('png-to-ico').then(pngToIco => {
            const fs = require('fs');
            pngToIco.default('./src-tauri/icons/icon.png')
              .then(buf => {
                fs.writeFileSync('./src-tauri/icons/icon.ico', buf);
                console.log('Generated: icon.ico');
              })
              .catch(console.error);
          }).catch(console.error);
          "

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload .msi installer
        uses: actions/upload-artifact@v4
        with:
          name: deaddrop-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi

      - name: Upload .exe installer
        uses: actions/upload-artifact@v4
        with:
          name: deaddrop-windows-exe
          path: src-tauri/target/release/bundle/nsis/*.exe
