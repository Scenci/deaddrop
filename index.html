<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>deaddrop</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <div class="header">
        <h1>deaddrop</h1>
        <div class="header-right">
          <div class="connection-status" id="connection-status">
            <span class="status-dot disconnected"></span>
            <span class="status-text">Not Connected</span>
          </div>
          <button id="connect-btn" class="primary">🔗 Connect</button>
          <div class="zoom-controls">
            <button id="zoom-out">➖</button>
            <span id="zoom-level">100%</span>
            <button id="zoom-in">➕</button>
          </div>
        </div>
      </div>

      <!-- Connection Modal -->
      <div id="connection-modal" class="modal hidden">
        <div class="modal-content">
          <div class="modal-header">
            <h2>Connect to Server</h2>
            <button class="modal-close" id="modal-close">✕</button>
          </div>
          <div class="modal-body">
            <input type="text" id="host" placeholder="Host (e.g., 192.168.1.10)" />
            <div class="input-with-toggle">
              <input type="password" id="port" placeholder="22" value="22" />
              <button type="button" id="toggle-port" class="eye-btn" tabindex="-1">👁️</button>
            </div>
            <input type="text" id="username" placeholder="Username" />
            <input type="password" id="password" placeholder="Password" />
            <div id="connect-status"></div>
          </div>
          <div class="modal-footer">
            <button id="modal-cancel">Cancel</button>
            <button id="modal-connect" class="primary">🔗 Connect</button>
          </div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="main-layout">
        <!-- Left Panel: Local Files -->
        <div class="file-panel local-panel">
          <div class="panel-header">
            <h3>📂 Local Machine</h3>
          </div>
          <div class="panel-toolbar">
            <button id="local-back-btn">← Back</button>
            <input type="text" id="local-path" class="path-input" value="/" />
            <button id="local-go-btn">Go</button>
          </div>
          <div class="panel-actions">
            <button id="local-new-folder-btn">📁 New Folder</button>
            <button id="local-refresh-btn">Refresh</button>
          </div>
          <div id="local-file-list" class="file-list"></div>
        </div>

        <!-- Center: Transfer Zone -->
        <div class="transfer-zone">
          <div class="drop-zone" id="drop-zone">
            <div class="transfer-arrow">→</div>
            <p>Drag files here to upload</p>
            <p class="drop-zone-hint">LOCAL → REMOTE</p>
          </div>
          <div class="transfer-buttons">
            <button id="upload-selected-btn" class="success" disabled>📤 Upload Selected</button>
          </div>
        </div>

        <!-- Right Panel: Remote Files -->
        <div class="file-panel remote-panel">
          <div class="panel-header">
            <h3>🌐 Remote Server</h3>
            <span id="remote-server-name" class="server-name"></span>
          </div>
          <div class="panel-toolbar">
            <button id="remote-back-btn">← Back</button>
            <input type="text" id="remote-path" class="path-input" value="/" />
            <button id="remote-go-btn">Go</button>
          </div>
          <div class="panel-actions">
            <button id="remote-new-folder-btn">📁 New Folder</button>
            <button id="remote-refresh-btn">Refresh</button>
          </div>
          <div id="remote-file-list" class="file-list">
            <div class="not-connected-message">
              <p>🔌 Not connected</p>
              <p class="hint">Click "Connect" to access remote files</p>
            </div>
          </div>
        </div>

        <!-- Far Right: Upload Queue -->
        <div class="queue-panel">
          <div class="queue-header">
            <h3>Upload Queue</h3>
            <div class="queue-header-actions">
              <span id="queue-status"></span>
              <button id="queue-clear-btn" class="small">Clear</button>
            </div>
          </div>
          <div id="queue-list" class="queue-list">
            <div class="queue-empty">📭 No uploads in queue</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
